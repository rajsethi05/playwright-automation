name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR cancels the one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  test:
    name: test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Pulled and started by GitHub before the steps run. Keep the tag pinned to the version under test.
      juice-shop:
        image: bkimminich/juice-shop:v20.2.0
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The Juice Shop image has no shell tools for a Docker health check, so poll it from the runner.
      - name: Wait for Juice Shop
        run: |
          for attempt in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000; then
              echo "Juice Shop is up"
              exit 0
            fi
            sleep 2
          done
          echo "Juice Shop did not start within 90 seconds"
          exit 1
      - name: Run Playwright tests
        run: npm test
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
